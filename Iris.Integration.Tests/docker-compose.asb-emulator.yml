# Azure Service Bus emulator, standalone alternative for local development.
#
# Usage:
#   docker compose -f docker-compose.asb-emulator.yml up -d
#   dotnet test --filter "FullyQualifiedName~AzureServiceBusContainerTests"
#   docker compose -f docker-compose.asb-emulator.yml down
#
# The integration tests manage their own container via Docker.DotNet and seed their own
# queues, so this file is only needed to keep an emulator running across several local runs.
# It publishes 5673 rather than 5672 so it can sit alongside a RabbitMQ container; point the
# suite at it by exporting the matching connection string.
#
# Pinned by digest: a floating tag changes emulator behaviour under a commit that changed
# nothing.

services:
  servicebus:
    image: mauritsarissen/openservicebus@sha256:c944c328793d26f684d4dc0d097dd10b4aff002a189a03abd8f86b11b4ce9e0c
    ports:
      - "5673:5672"
      - "5300:5300"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5300/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
