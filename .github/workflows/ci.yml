name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: |
          dotnet test Services/Iris.Brokers.Test/Iris.Brokers.Test.csproj --no-build --configuration Release --verbosity normal
          dotnet test Services/Assemblies/Iris.Assemblies.Test/Iris.Assemblies.Test.csproj --no-build --configuration Release --verbosity normal
          dotnet test Iris.Components.Test/Iris.Components.Test.csproj --no-build --configuration Release --verbosity normal
          dotnet test Services/Telemetry/Iris.Telemetry.Test/Iris.Telemetry.Test.csproj --no-build --configuration Release --verbosity normal
          dotnet test Services/Sagas/Iris.Sagas.Test/Iris.Sagas.Test.csproj --no-build --configuration Release --verbosity normal
          dotnet test Iris.Desktop.Test/Iris.Desktop.Test.csproj --no-build --configuration Release --verbosity normal

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration Tests
        run: >
          dotnet test Iris.Integration.Tests/Iris.Integration.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
